<!doctype html>
<!-- Source for the store promo images. Render with assets/promo.sh. -->
<meta charset="utf-8">
<title>promo</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 440px; height: 280px;
    display: flex; flex-direction: column; gap: 22px;
    align-items: center; justify-content: center;
    background: #0d1117;
    font: 400 16px -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: #e6edf3; overflow: hidden;
  }
  body.marquee { width: 1400px; height: 560px; flex-direction: row; gap: 90px; }

  .icon { width: 88px; height: 88px; }
  .marquee .icon { width: 176px; height: 176px; }

  h1 { font-size: 34px; font-weight: 650; letter-spacing: -.5px; line-height: 1.2; text-align: center; }
  .marquee h1 { font-size: 68px; text-align: left; }
  h1 .dim { color: #8b949e; }
  p { margin-top: 14px; font-size: 15px; color: #8b949e; text-align: center; }
  .marquee p { font-size: 28px; text-align: left; }

  /* The tree mock: what the extension actually does, in the store's own pixels. */
  .tree { display: none; }
  .marquee .tree {
    display: block; width: 340px; padding: 22px 26px;
    border: 1px solid #30363d; border-radius: 12px; background: #161b22;
    font-size: 22px; line-height: 2.1; color: #e6edf3;
  }
  .tree .row { display: flex; align-items: center; gap: 10px; }
  .tree .child { padding-left: 28px; color: #c9d1d9; }
  .tree .count { margin-left: auto; font-size: 17px; color: #8b949e; }
</style>

<div>
  <h1>Nested star lists<br><span class="dim">for GitHub</span></h1>
  <p>Star lists named <code>parent/child</code>, as a folder tree.</p>
</div>

<div class="tree">
  <div class="row">📁 Dev</div>
  <div class="row child">Compiler <span class="count">1 repository</span></div>
  <div class="row child">Testing <span class="count">1 repository</span></div>
  <div class="row child">Tools <span class="count">30 repositories</span></div>
  <div class="row">📁 Learn</div>
</div>

  if (location.search.includes('marquee')) document.body.className = 'marquee';
</script>
