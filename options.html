<!doctype html>
<meta charset="utf-8">
<title>Nested star lists for GitHub</title>
<style>
  /* One palette per scheme. The viewer's own choice (data-theme) beats the
     system's, and color-scheme drags the native checkboxes and radios along. */
  :root { --fg: #1f2328; --bg: #fff; --muted: #59636e; --border: #d1d9e0; --track: #818b98; --accent: #0969da; color-scheme: light; }
  :root[data-theme="dark"] { --fg: #f0f6fc; --bg: #0d1117; --muted: #9198a1; --border: #3d444d; --track: #3d444d; --accent: #1f6feb; color-scheme: dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --fg: #f0f6fc; --bg: #0d1117; --muted: #9198a1; --border: #3d444d; --track: #3d444d; --accent: #1f6feb; color-scheme: dark; }
  }
  body {
    margin: 0; padding: 16px 20px;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    /* A width, not min-width: Firefox sizes the popup to the content's
       max-content width, so without one the long description lines stretch it
       to the 800px popup limit. The max-width keeps the same page from
       overflowing on Firefox for Android, where it opens at screen width. */
    color: var(--fg); background: var(--bg); width: 340px; max-width: calc(100% - 40px);
  }
  h1 { font-size: 14px; margin: 0 0 12px; display: flex; align-items: center; justify-content: space-between; }
  /* One button cycles the theme; the icon it shows is the state it is in. */
  #theme { all: unset; cursor: pointer; display: inline-flex; padding: 2px; border-radius: 4px; color: var(--muted); }
  #theme:hover { color: var(--fg); }
  #theme:focus-visible { outline: 2px solid var(--muted); }
  #theme svg { fill: currentColor; display: none; }
  :root:not([data-theme]) #theme .system, :root[data-theme="light"] #theme .light, :root[data-theme="dark"] #theme .dark { display: block; }
  label { display: flex; gap: 8px; align-items: flex-start; }
  /* A checkbox drawn as a switch, at the end of its row. The input stays a
     checkbox, so the script and the stored value do not change. */
  label > input[type="checkbox"] {
    appearance: none; order: 1; margin: 2px 0 0 auto; flex: none;
    width: 32px; height: 18px; border-radius: 9px; position: relative; cursor: pointer;
    background: var(--track); transition: background .15s;
  }
  label > input[type="checkbox"]::before {
    content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; transition: left .15s;
  }
  label > input[type="checkbox"]:checked { background: var(--accent); }
  label > input[type="checkbox"]:checked::before { left: 16px; }
  label > input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  fieldset { margin: 14px 0 0; padding: 8px 12px 10px; border: 1px solid var(--border); border-radius: 6px; }
  legend { font-size: 12px; padding: 0 4px; }
  fieldset label { margin: 4px 0; align-items: center; }
  p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  footer { margin: 14px 0 0; font-size: 12px; color: var(--muted); }
  footer a { color: inherit; }
</style>

<h1>
  Nested star lists for GitHub
  <button id="theme" type="button" aria-label="Popup theme" title="Popup theme: follows the system">
    <svg class="system" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M14.25 1c.966 0 1.75.784 1.75 1.75v7.5A1.75 1.75 0 0 1 14.25 12h-3.727c.099 1.041.52 1.872 1.292 2.757A.752.752 0 0 1 11.25 16h-6.5a.75.75 0 0 1-.565-1.243c.772-.885 1.192-1.716 1.292-2.757H1.75A1.75 1.75 0 0 1 0 10.25v-7.5C0 1.784.784 1 1.75 1ZM1.75 2.5a.25.25 0 0 0-.25.25v7.5a.25.25 0 0 0 .25.25h12.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25ZM9.018 12H6.982a5.72 5.72 0 0 1-.765 2.5h3.566a5.72 5.72 0 0 1-.765-2.5Z"/></svg>
    <svg class="light" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 12a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-1.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5Zm5.657-8.157a.75.75 0 0 1 0 1.061l-1.061 1.06a.749.749 0 0 1-1.275-.326.749.749 0 0 1 .215-.734l1.06-1.06a.75.75 0 0 1 1.06 0Zm-9.193 9.193a.75.75 0 0 1 0 1.06l-1.06 1.061a.75.75 0 1 1-1.061-1.06l1.06-1.061a.75.75 0 0 1 1.061 0ZM8 0a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0V.75A.75.75 0 0 1 8 0ZM3 8a.75.75 0 0 1-.75.75H.75a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 3 8Zm13 0a.75.75 0 0 1-.75.75h-1.5a.75.75 0 0 1 0-1.5h1.5A.75.75 0 0 1 16 8Zm-8 5a.75.75 0 0 1 .75.75v1.5a.75.75 0 0 1-1.5 0v-1.5A.75.75 0 0 1 8 13Zm3.536-1.464a.75.75 0 0 1 1.06 0l1.061 1.06a.75.75 0 0 1-1.06 1.061l-1.061-1.06a.75.75 0 0 1 0-1.061ZM2.343 2.343a.75.75 0 0 1 1.061 0l1.06 1.061a.751.751 0 0 1-.018 1.042.751.751 0 0 1-1.042.018l-1.06-1.06a.75.75 0 0 1 0-1.06Z"/></svg>
    <svg class="dark" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.598 1.591a.749.749 0 0 1 .785-.175 7.001 7.001 0 1 1-8.967 8.967.75.75 0 0 1 .961-.96 5.5 5.5 0 0 0 7.046-7.046.75.75 0 0 1 .175-.786Zm1.616 1.945a7 7 0 0 1-7.678 7.678 5.499 5.499 0 1 0 7.678-7.678Z"/></svg>
  </button>
</h1>
<label>
  <input type="checkbox" role="switch" id="showFullPaths">
  <span>
    Show the full list name
    <p>Each row shows its full name in grey, like <code>child (parent/child)</code>.</p>
  </span>
</label>

<label style="margin-top:12px">
  <input type="checkbox" role="switch" id="foldersOpen">
  <span>
    Start with folders expanded
    <p>Folders begin collapsed; turn this on to open every folder by default.</p>
  </span>
</label>

<label style="margin-top:12px">
  <input type="checkbox" role="switch" id="suggestFolders">
  <span>
    Suggest folders when naming a list
    <p>The name field of GitHub's list dialog offers the folders already in use, like <code>parent/</code>.</p>
  </span>
</label>

<fieldset>
  <legend>Sort lists</legend>
  <label><input type="radio" name="sortMode" value="name"> By name</label>
  <label><input type="radio" name="sortMode" value="type"> Folders first, then lists</label>
  <label><input type="radio" name="sortMode" value="github"> Keep GitHub's order</label>
  <p>GitHub's own Sort menu decides; a folder sits where its first list was. Not in the star button's panel.</p>
</fieldset>

<!-- Links in a popup must open a tab: a plain navigation replaces the popup
     with the page. -->
<footer>
  <a href="https://github.com/injaeryou/Nested-star-lists-for-GitHub" target="_blank" rel="noopener noreferrer">GitHub</a>
  &middot;
  <a href="https://github.com/injaeryou/Nested-star-lists-for-GitHub/issues/new" target="_blank" rel="noopener noreferrer">Report an issue</a>
</footer>

<script src="options.js"></script>
